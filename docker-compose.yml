services:
  # ========================================
  # Kafka 7.8.0
  # ========================================
  kafka:
    image: confluentinc/cp-kafka:7.8.0
    container_name: crypto-kafka
    ports:
      - "19092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_LISTENERS: "PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:19092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      CLUSTER_ID: "MkQkSjI5ZjBN"
    networks:
      - crypto-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 0",
        ]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ========================================
  # MySQL 8.0
  # ========================================
  mysql:
    image: mysql:8.0
    container_name: crypto-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: crypto_analysis
      TZ: Asia/Shanghai
      LANG: C.UTF-8
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    command: >
      --default-authentication-plugin=mysql_native_password 
      --character-set-server=utf8mb4 
      --collation-server=utf8mb4_unicode_ci
      --init-connect='SET NAMES utf8mb4'
    networks:
      - crypto-network
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p123456",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  # ========================================
  # ClickHouse 24.11
  # ========================================
  clickhouse:
    image: clickhouse/clickhouse-server:24.11
    container_name: crypto-clickhouse
    environment:
      CLICKHOUSE_DB: crypto_data
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: 123456
      TZ: Asia/Shanghai
    ports:
      - "8124:8123"
      - "9001:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./docker/clickhouse/init:/docker-entrypoint-initdb.d
      - ./docker/clickhouse/users.d:/etc/clickhouse-server/users.d
    networks:
      - crypto-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========================================
  # Redis 7
  # ========================================
  redis:
    image: redis:7-alpine
    container_name: crypto-redis
    ports:
      - "6380:6379"
    command: redis-server --appendonly yes --requirepass ""
    volumes:
      - redis-data:/data
    networks:
      - crypto-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========================================
  # Flink JobManager
  # ========================================
  flink-jobmanager:
    image: flink:2.0.0-scala_2.12-java21
    container_name: crypto-flink-jobmanager
    ports:
      - "18081:8081"
    command: jobmanager
    environment:
      TZ: Asia/Shanghai
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        jobmanager.memory.process.size: 1536m
        taskmanager.numberOfTaskSlots: 8
        taskmanager.memory.process.size: 2048m
        parallelism.default: 4
    volumes:
      - ./crypto-flink-jobs/target:/opt/flink/usrlib
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
        reservations:
          memory: 1024M
    networks:
      - crypto-network
    depends_on:
      kafka:
        condition: service_healthy
      mysql:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ========================================
  # Flink TaskManager (Flink 2.0 + Java 21 官方镜像)
  # ========================================
  flink-taskmanager:
    image: flink:2.0.0-scala_2.12-java21
    container_name: crypto-flink-taskmanager
    command: taskmanager
    environment:
      TZ: Asia/Shanghai
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 12
        taskmanager.memory.process.size: 2048m
        parallelism.default: 4
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 3072M
        reservations:
          memory: 2048M
    networks:
      - crypto-network
    depends_on:
      - flink-jobmanager

  # ========================================
  # Flink Job 自动提交器 (Flink 2.0 + Java 21 官方镜像)
  # 注意:此容器用于一次性提交作业后退出,不需要持续运行
  # 作业提交失败,可手动重启: docker-compose restart flink-job-submitter
  # ========================================
  flink-job-submitter:
    image: flink:2.0.0-scala_2.12-java21
    container_name: crypto-flink-job-submitter
    command: |
      bash -c '
        echo "[Flink Job Submitter] 等待Flink集群完全启动..." &&
        sleep 60 &&
        echo "[Flink Job Submitter] 开始提交作业..." &&
        until curl -s http://flink-jobmanager:8081 > /dev/null 2>&1; do
          echo "[Flink Job Submitter] 等待Flink JobManager可用..."
          sleep 5
        done &&
        echo "[Flink Job Submitter] JobManager已就绪，开始提交作业..." &&
        
        # 1. 提交K线聚合作业 (计算密集, 并行度4)
        echo "提交 K线聚合作业..." &&
        /opt/flink/bin/flink run -d \
          --jobmanager flink-jobmanager:8081 \
          --class com.crypto.flink.job.KlineAggregationJob \
          /opt/flink/usrlib/crypto-flink-jobs-1.0.0.jar \
          --kafka.bootstrap.servers kafka:29092 \
          --clickhouse.url "jdbc:clickhouse://clickhouse:8123/crypto_data?serverTimezone=Asia/Shanghai" \
          --clickhouse.password 123456 \
          --redis.host redis \
          --redis.port 6379 \
          --parallelism 4 &&
          
        # 2. 提交价格异常检测作业 (数据量小, 并行度2)
        echo "提交 价格异常检测作业..." &&
        /opt/flink/bin/flink run -d \
          --jobmanager flink-jobmanager:8081 \
          --class com.crypto.flink.job.PriceAnomalyDetectionJob \
          /opt/flink/usrlib/crypto-flink-jobs-1.0.0.jar \
          --kafka.bootstrap.servers kafka:29092 \
          --parallelism 2 &&
          
        # 3. 提交交易量分析作业 (处理海量原始数据, 并行度4)
        echo "提交 交易量分析作业..." &&
        /opt/flink/bin/flink run -d \
          --jobmanager flink-jobmanager:8081 \
          --class com.crypto.flink.job.VolumeAnalysisJob \
          /opt/flink/usrlib/crypto-flink-jobs-1.0.0.jar \
          --kafka.bootstrap.servers kafka:29092 \
          --parallelism 4 &&
          
        echo "[Flink Job Submitter] 所有Flink作业提交成功!" &&
        echo "[Flink Job Submitter] 作业已在JobManager和TaskManager上运行" &&
        echo "[Flink Job Submitter] 可在 http://localhost:18081 查看作业状态" &&
        echo "[Flink Job Submitter] 本容器任务完成,将在30秒后退出..." &&
        sleep 30
      '
    volumes:
      - ./crypto-flink-jobs/target:/opt/flink/usrlib
    networks:
      - crypto-network
    depends_on:
      - flink-jobmanager
      - flink-taskmanager
      - kafka
      - clickhouse
      - redis
    restart: "no"

  # ========================================
  # 数据采集服务
  # ========================================
  crypto-collector:
    build:
      context: .
      dockerfile: crypto-collector/Dockerfile
    container_name: crypto-collector
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      # Redis配置 - 用于监控统计
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      # 配置4组主流交易对监控：BTC、ETH、BNB、SOL
      OKX_SYMBOLS: BTC-USDT,ETH-USDT,BNB-USDT,SOL-USDT
    networks:
      - crypto-network
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -v grep | grep -q 'java' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ========================================
  # API服务
  # ========================================
  crypto-api:
    build:
      context: .
      dockerfile: crypto-api-service/Dockerfile
    container_name: crypto-api
    restart: unless-stopped
    ports:
      - "18080:8080"
    environment:
      # MySQL配置
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: 123456
      # ClickHouse配置
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: 123456
      # Redis配置
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      # Kafka配置
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      # JVM配置
      JAVA_OPTS: -Xms512m -Xmx2048m -XX:+UseG1GC
    networks:
      - crypto-network
    depends_on:
      mysql:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "--spider",
          "http://localhost:8080/actuator/health",
        ]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 60s

  # ========================================
  # 前端服务 (Nginx + 多阶段构建)
  # 无需本地 npm，Docker 自动构建前端
  # ========================================
  crypto-frontend:
    build:
      context: ./crypto-frontend
      dockerfile: Dockerfile
    container_name: crypto-frontend
    ports:
      - "3000:80"
    volumes:
      # 仅挂载 Nginx 配置文件
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - crypto-network
    depends_on:
      - crypto-api
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

# ========================================
# 数据卷
# ========================================
volumes:
  mysql-data:
    driver: local
  clickhouse-data:
    driver: local
  redis-data:
    driver: local

# ========================================
# 网络
# ========================================
networks:
  crypto-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16
